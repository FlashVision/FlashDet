name: Copilot Setup Steps

# Copilot coding agent runs this job before it starts working on an issue.
# The job MUST be named exactly `copilot-setup-steps`.

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install FlashDet and test dependencies
        run: |
          pip install -e ".[dev,tracker,solutions,analytics]"

      - name: Verify package and CLI
        run: |
          python -c "import flashdet; print('flashdet', flashdet.__version__)"
          flashdet version
          flashdet check

      - name: Quick smoke test
        run: pytest tests/smoke/ -m smoke -q --timeout=60
